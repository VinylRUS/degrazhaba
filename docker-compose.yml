version: "3.8"

services:
  # ============ Main Web App (Next.js) ============
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./db/custom.db
    volumes:
      - streampost-db:/app/db
    networks:
      - streampost-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ Realtime Service (Socket.io) ============
  realtime:
    build:
      context: ./mini-services/realtime-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    networks:
      - streampost-network
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # ============ Chat Integration Service ============
  chat-service:
    build:
      context: ./mini-services/chat-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - .env
    networks:
      - streampost-network
    restart: unless-stopped
    depends_on:
      - realtime

  # ============ Telegram Bot ============
  bot:
    build:
      context: ./streampost-bot
      dockerfile: Dockerfile
    env_file:
      - ./streampost-bot/.env
    networks:
      - streampost-network
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

networks:
  streampost-network:
    driver: bridge

volumes:
  streampost-db:
